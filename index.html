
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ENCONTRE UMA SAÍDA! | SALA 02</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050608;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(ellipse,#202329 0%,#08090c 70%);
}
#menu h1{font-size:clamp(28px,6vw,55px);margin:0;color:#eee}
#menu h1 span{color:#d71920}
#menu p{color:#aaa;letter-spacing:3px}
button{
 background:#a80f18;color:white;border:1px solid #ff5555;
 padding:14px 25px;font-size:16px;font-weight:bold;
 cursor:pointer;border-radius:4px;
}
button:active{transform:scale(.96)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#brand{position:absolute;top:15px;left:15px;font-size:13px;letter-spacing:2px;color:#ddd}
#objective{position:absolute;top:45px;left:15px;color:#ff7777;font-size:13px}
#message{
 position:absolute;left:50%;top:18%;transform:translateX(-50%);
 background:#08090de8;border:1px solid #9b2229;
 padding:12px 18px;text-align:center;max-width:85%;
 opacity:0;transition:opacity .3s;font-size:14px;
}
#prompt{
 position:absolute;bottom:16%;left:50%;transform:translateX(-50%);
 background:#08090dcc;padding:10px 15px;border:1px solid #777;
 opacity:0;font-size:13px;
}
#crosshair{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:8px;height:8px;border:1px solid #ddd;border-radius:50%;
}
#controls{position:absolute;bottom:20px;left:20px;display:none;pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,55px);gap:5px}
.pad button{padding:0;background:#222b;border-color:#7779;font-size:22px}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#look{position:absolute;right:15px;bottom:25px;width:125px;height:125px;
 border:1px solid #ffffff44;border-radius:50%;pointer-events:auto}
#use{
 position:absolute;right:25px;bottom:165px;pointer-events:auto;
 display:none;padding:12px 17px;
}
#footer{position:absolute;bottom:10px;width:100%;text-align:center;color:#777;font-size:10px}
</style>
</head>
<body>

<div id="menu">
 <h1>ENCONTRE UMA <span>SAÍDA!</span></h1>
 <p>AB GAMES APRESENTA</p>
 <h2>SALA 02 — INSTALAÇÃO DE ENERGIA</h2>
 <button id="play">ENTRAR NA INSTALAÇÃO</button>
 <p style="font-size:11px;letter-spacing:1px;margin-top:22px">
 PC: WASD + MOUSE | E: INTERAGIR<br>
 CELULAR: CONTROLES NA TELA
 </p>
</div>

<div id="hud">
 <div id="brand">AB GAMES // SALA 02</div>
 <div id="objective">OBJETIVO: ENCONTRE O PAINEL PRINCIPAL</div>
 <div id="message"></div>
 <div id="prompt">PRESSIONE E PARA INTERAGIR</div>
 <div id="crosshair"></div>
 <div id="controls">
  <div class="pad">
   <button id="up">▲</button>
   <button id="left">◀</button>
   <button id="down">▼</button>
   <button id="right">▶</button>
  </div>
 </div>
 <div id="look"></div>
 <button id="use">INTERAGIR</button>
 <div id="footer">ENCONTRE UMA SAÍDA! — AB GAMES</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(() => {
const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const message=document.getElementById("message");
const prompt=document.getElementById("prompt");
const useButton=document.getElementById("use");

if(!window.THREE){
 menu.innerHTML="<h2>Não foi possível carregar os gráficos.</h2><p>Verifique sua conexão e tente novamente.</p>";
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080b10);
scene.fog=new THREE.FogExp2(0x080b10,.027);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const clock=new THREE.Clock();
const keys={};
let yaw=0,pitch=0;
let started=false,interacted=false;
let playerHeight=0;
const player=new THREE.Vector3(0,0,10);
const velocity=new THREE.Vector3();
const smoke=[];
const warningLights=[];
const generators=[];
const materials={};

function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
materials.floor=mat(0x292d31);
materials.wall=mat(0x25292e);
materials.metal=mat(0x555d65,.7,.65);
materials.dark=mat(0x11161b);
materials.yellow=mat(0xd3a52b);
materials.red=mat(0x9d1018);
materials.glow=new THREE.MeshBasicMaterial({color:0xff2020});
materials.screen=new THREE.MeshBasicMaterial({color:0x173f4b});

function box(x,y,z,w,h,d,material){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}
function cylinder(x,y,z,r1,r2,h,material,segments=12){
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}
function line(x1,y1,z1,x2,y2,z2,r,material){
 const a=new THREE.Vector3(x1,y1,z1);
 const b=new THREE.Vector3(x2,y2,z2);
 const dir=new THREE.Vector3().subVectors(b,a);
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,dir.length(),8),material
 );
 mesh.position.copy(a).add(b).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 scene.add(mesh);
 return mesh;
}

// ILUMINAÇÃO
scene.add(new THREE.HemisphereLight(0x8b9aaa,0x17120f,.48));
const mainLight=new THREE.PointLight(0xc1d4e5,95,55);
mainLight.position.set(0,13,0);
scene.add(mainLight);

for(let x=-14;x<=14;x+=7){
 for(let z=-9;z<=9;z+=9){
  const lamp=box(x,15.7,z,1.8,.12,.35,mat(0x87919a));
  const light=new THREE.PointLight(0xa9c7dc,13,12);
  light.position.set(x,15,z);
  scene.add(light);
 }
}

// ESTRUTURA DA INSTALAÇÃO
box(0,-.35,0,38,.7,30,materials.floor);
box(0,16.5,0,38,.5,30,materials.dark);
box(-19,8,0,.5,16,30,materials.wall);
box(19,8,0,.5,16,30,materials.wall);
box(0,8,-15,38,16,.5,materials.wall);
box(0,8,15,38,16,.5,materials.wall);

// VIGAS SUPERIORES
for(let x=-16;x<=16;x+=8){
 box(x,15.9,0,.35,.35,29,materials.metal);
}
for(let z=-12;z<=12;z+=6){
 box(0,15.8,z,37,.3,.35,materials.metal);
}

// PLATAFORMAS DOS ANDARES
box(0,3.9,-3,8,.35,15,materials.metal);
box(14,7.9,-3,8,.35,15,materials.metal);

// GUARDA-CORPOS
for(const y of [4.2,8.2]){
 const x1=y===4.2?-4:10;
 const x2=y===4.2?4:18;
 for(let x=x1;x<=x2;x+=2){
  line(x,y-.2,-9,x,y+1.1,-9,.055,materials.metal);
  line(x,y-.2,3,x,y+1.1,3,.055,materials.metal);
 }
 line(x1,y+1,-9,x2,y+1,-9,.07,materials.metal);
 line(x1,y+1,3,x2,y+1,3,.07,materials.metal);
}

// ESCADARIA GIGANTE — PRIMEIRO LANCE
function buildStair(startX,endX,startY,endY,z){
 const count=20;
 const width=(endX-startX)/count;
 for(let i=0;i<count;i++){
  const t=(i+.5)/count;
  const x=startX+(endX-startX)*t;
  const y=startY+(endY-startY)*t;
  box(x,y,z,width*.98,.18,4,materials.metal);
  box(x,y-.16,z-2,.12,.12,.15,materials.yellow);
  box(x,y-.16,z+2,.12,.12,.15,materials.yellow);
 }
 // corrimãos inclinados
 const railMat=mat(0x87919a,.6,.7);
 for(const side of [-2,2]){
  line(startX,startY+.9,z+side,endX,endY+.9,z+side,.09,railMat);
  for(let i=0;i<=10;i++){
   const t=i/10;
   const x=startX+(endX-startX)*t;
   const y=startY+(endY-startY)*t;
   line(x,y,z+side,x,y+.9,z+side,.045,railMat);
  }
 }
}
buildStair(-12,-3,0,4,-3);
buildStair(3,12,4,8,-3);

// PLATAFORMA INTERMEDIÁRIA
box(0,4,-3,6,.25,4,materials.metal);

// GERADORES
function generator(x,z,index){
 const body=box(x,1.45,z,4,2.7,3,mat(0x333a40,.6,.5));
 box(x,2.9,z,3.6,.18,2.7,materials.metal);
 box(x,1.4,z+1.56,2.8,1.5,.12,materials.dark);
 for(let i=0;i<4;i++){
  cylinder(x-1.35+i*.9,.7,z+1.65,.22,.22,.12,materials.yellow,12);
 }
 // tubos superiores
 for(let i=0;i<3;i++){
  cylinder(x-1+i,3.4,z,.12,.12,1.2,materials.metal);
 }
 const lamp=box(x+1.65,2.8,z+1.6,.18,.18,.18,materials.glow);
 warningLights.push(lamp);
 generators.push(body);

 // Fumaça
 for(let i=0;i<9;i++){
  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.25+Math.random()*.25,7,6),
   new THREE.MeshBasicMaterial({color:0x777d82,transparent:true,opacity:.2})
  );
  p.position.set(x+1,3.5+i*.25,z);
  scene.add(p);
  smoke.push({mesh:p,baseY:p.position.y,offset:i*.7});
 }
}
generator(-11,-9,0);
generator(-5,8,1);
generator(8,9,2);

// TUBULAÇÕES INDUSTRIAIS
for(let z=-12;z<=12;z+=3){
 line(-17,12,z,17,12,z,.16,materials.metal);
 line(-17,11.5,z,17,11.5,z,.08,materials.yellow);
}
for(let x=-15;x<=15;x+=5){
 line(x,.5,-13,x,9,-13,.14,materials.metal);
 line(x,.5,13,x,9,13,.14,materials.metal);
}

// CABOS NO CHÃO
for(let i=0;i<7;i++){
 const cable=line(-15,.08,-10+i*.8,12,.08,-10+i*.8,.045,mat(0x15191c));
}

// PAINÉIS E MONITORES
for(let i=0;i<4;i++){
 const x=-15+i*2;
 box(x,2.2,-14.5,1.4,2.8,.25,materials.dark);
 box(x,2.6,-14.32,1,.7,.06,materials.screen);
 box(x,1.7,-14.32,.35,.12,.06,materials.red);
}

// PAINEL PRINCIPAL NO TOPO
box(14,9.5,-7,3.5,3,.55,materials.dark);
box(14,9.6,-6.68,2.8,1.35,.08,mat(0x152e36));
box(13.3,9.8,-6.6,.22,.22,.1,materials.glow);
box(14,8.5,-6.6,2.5,.15,.1,materials.red);
for(let i=0;i<5;i++){
 box(12.9+i*.55,10.5,-6.6,.25,.1,.1,materials.yellow);
}
const panelLight=new THREE.PointLight(0xff2424,5,7);
panelLight.position.set(14,10,-5.5);
scene.add(panelLight);

// LUZES DE EMERGÊNCIA
for(const x of [-15,-8,0,8,15]){
 const lamp=box(x,14.8,13,.6,.25,.6,materials.glow);
 const light=new THREE.PointLight(0xff1515,2.5,13);
 light.position.set(x,14,13);
 scene.add(light);
 warningLights.push(lamp);
}

// VENTILADORES
for(const x of [-12,0,12]){
 const fan=cylinder(x,13.7,-14,.9,.9,.25,materials.dark);
 fan.rotation.x=Math.PI/2;
 for(let i=0;i<4;i++){
  const blade=box(x,13.7,-13.8,1.5,.12,.12,materials.metal);
  blade.rotation.z=i*Math.PI/2;
 }
}

// OBJETOS DECORATIVOS
for(let i=0;i<12;i++){
 const x=-16+Math.random()*32;
 const z=-12+Math.random()*24;
 if(Math.abs(x)<3 && z<1 && z>-7) continue;
 box(x,.25,z,.5,.5,.5,materials.yellow);
}

// PISO E ALTURA DAS ESCADAS
function getFloorHeight(x,z){
 // Primeiro lance: sobe da esquerda para a plataforma central
 if(x>=-12.2 && x<=-3 && z>=-5.2 && z<=-.8){
  return Math.max(0,Math.min(4,(x+12)/9*4));
 }
 // Plataforma intermediária
 if(x>=-3.2 && x<=3.2 && z>=-9 && z<=3){
  return 4;
 }
 // Segundo lance: sobe até o último nível
 if(x>=3 && x<=12.2 && z>=-5.2 && z<=-.8){
  return Math.max(4,Math.min(8,4+(x-3)/9*4));
 }
 // Plataforma superior
 if(x>=12 && x<=18 && z>=-10 && z<=4){
  return 8;
 }
 return 0;
}

// CONTROLES
function showMessage(text){
 message.textContent=text;
 message.style.opacity=1;
 clearTimeout(showMessage.timer);
 showMessage.timer=setTimeout(()=>message.style.opacity=0,3500);
}
function start(){
 started=true;
 menu.style.display="none";
 hud.style.display="block";
 document.getElementById("controls").style.display="block";
 useButton.style.display="block";
 camera.position.set(player.x,1.7,player.z);
 showMessage("A instalação parece estar funcionando... mas há algo errado.");
}
document.getElementById("play").onclick=start;

function setKey(k,on){keys[k]=on;}
const keyMap={KeyW:"w",ArrowUp:"w",KeyS:"s",ArrowDown:"s",
 KeyA:"a",ArrowLeft:"a",KeyD:"d",ArrowRight:"d"};
addEventListener("keydown",e=>{
 if(keyMap[e.code]){setKey(keyMap[e.code],true);e.preventDefault();}
 if(e.code==="KeyE")interact();
});
addEventListener("keyup",e=>{
 if(keyMap[e.code])setKey(keyMap[e.code],false);
});

document.querySelectorAll(".pad button").forEach(btn=>{
 const id=btn.id;
 const k={up:"w",down:"s",left:"a",right:"d"}[id];
 btn.addEventListener("pointerdown",e=>{e.preventDefault();setKey(k,true);});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  btn.addEventListener(ev,()=>setKey(k,false)));
});

let lastTouch=null;
const look=document.getElementById("look");
look.addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
 look.setPointerCapture(e.pointerId);
});
look.addEventListener("pointermove",e=>{
 if(!lastTouch)return;
 const dx=e.clientX-lastTouch.x;
 const dy=e.clientY-lastTouch.y;
 yaw-=dx*.006;
 pitch-=dy*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 lastTouch={x:e.clientX,y:e.clientY};
});
look.addEventListener("pointerup",()=>lastTouch=null);
look.addEventListener("pointercancel",()=>lastTouch=null);

// MOUSE NO PC
renderer.domElement.addEventListener("click",()=>{
 if(started && innerWidth>700 && document.pointerLockElement!==renderer.domElement){
  renderer.domElement.requestPointerLock?.();
 }
});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
 }
});

// INTERAÇÃO COM O PAINEL
function interact(){
 if(!started)return;
 const panelPos=new THREE.Vector3(14,9.5,-7);
 const p=new THREE.Vector3(player.x,playerHeight+1.5,player.z);
 if(p.distanceTo(panelPos)<4.5){
  if(!interacted){
   interacted=true;
   document.getElementById("objective").textContent="OBJETIVO: PAINEL ENCONTRADO";
   showMessage("PAINEL PRINCIPAL: FALHA CRÍTICA DETECTADA. SISTEMA BLOQUEADO.");
   panelLight.intensity=18;
  }else{
   showMessage("O painel está bloqueado. Você precisa descobrir como restaurar a energia.");
  }
 }else{
  showMessage("Não há nada para interagir aqui.");
 }
}
useButton.addEventListener("click",interact);

// ANIMAÇÃO
let time=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 time+=dt;

 if(started){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();
  if(keys.w)move.add(forward);
  if(keys.s)move.sub(forward);
  if(keys.d)move.add(right);
  if(keys.a)move.sub(right);
  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(5*dt);
   player.add(move);
  }
  player.x=THREE.MathUtils.clamp(player.x,-17.5,17.5);
  player.z=THREE.MathUtils.clamp(player.z,-13.5,13.5);

  playerHeight=getFloorHeight(player.x,player.z);
  camera.position.set(player.x,playerHeight+1.7,player.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  const panelPos=new THREE.Vector3(14,9.5,-7);
  const distance=new THREE.Vector3(player.x,playerHeight+1.5,player.z).distanceTo(panelPos);
  prompt.style.opacity=distance<4.5?1:0;
 }

 // Fumaça subindo
 smoke.forEach(s=>{
  s.mesh.position.y=s.baseY+((time*.65+s.offset)%3);
  s.mesh.position.x+=Math.sin(time+s.offset)*.001;
  s.mesh.material.opacity=.22*(1-((s.mesh.position.y-s.baseY)/3));
 });

 // Luzes de emergência piscando
 const flicker=Math.random()>.94?0.2:1;
 warningLights.forEach((lamp,i)=>{
  lamp.visible=Math.sin(time*3+i*1.7)>-.45;
 });
 if(interacted){
  panelLight.intensity=5+Math.sin(time*8)*3;
 }
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
})();
</script>
</body>
</html>
