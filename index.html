// CAMADA DO JOGO ATRÁS DOS CONTROLES

function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

const floorMat=mat(0x30343a);
const wallMat=mat(0x242930);
const metalMat=mat(0x65717b,.65,.7);
const darkMetal=mat(0x171d23,.8,.5);
const blackMat=mat(0x090d11);
const yellowMat=mat(0xd1a12a);

const screenMat=mat(0x071014);
const greenMat=mat(0x101c16);
const orangeMat=mat(0x21170b);
const redLightMat=mat(0x200709);

function box(x,y,z,w,h,d,material){
 const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

function cylinder(x,y,z,r1,r2,h,material,segments=16){
 const obj=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

function pipe(x1,y1,z1,x2,y2,z2,r,material=metalMat){
 const a=new THREE.Vector3(x1,y1,z1);
 const b=new THREE.Vector3(x2,y2,z2);
 const dir=new THREE.Vector3().subVectors(b,a);
 const obj=new THREE.Mesh(new THREE.CylinderGeometry(r,r,dir.length(),12),material);
 obj.position.copy(a).add(b).multiplyScalar(.5);
 obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 scene.add(obj);
 return obj;
}

// SALA INDUSTRIAL 120 x 100
box(0,-.25,0,120,.5,100,floorMat);
box(0,8,-50,120,16,.5,wallMat);
box(0,8,50,120,16,.5,wallMat);
box(-60,8,0,.5,16,100,wallMat);
box(60,8,0,.5,16,100,wallMat);
box(0,16,0,120,.5,100,wallMat);

for(let x=-55;x<=55;x+=10){
 box(x,1,-49.7,3,.18,.08,yellowMat);
 box(x,1,49.7,3,.18,.08,yellowMat);
}
for(let z=-45;z<=45;z+=10){
 box(-59.7,1,z,.08,.18,3,yellowMat);
 box(59.7,1,z,.08,.18,3,yellowMat);
}

scene.add(new THREE.HemisphereLight(0x202735,0x08090c,.035));

function createGenerator(x,z){
 box(x,.16,z,6.2,.32,4.8,darkMetal);
 box(x,.36,z,5.8,.15,4.4,metalMat);

 for(const sx of [-2.35,2.35]){
  for(const sz of [-1.65,1.65]){
   box(x+sx,.55,z+sz,.42,.45,.42,blackMat);
   box(x+sx,.33,z+sz,.65,.12,.65,metalMat);
  }
 }

 box(x,1.75,z,5.15,2.45,3.65,bodyMat);
 box(x,3.05,z,4.85,.2,3.4,metalMat);
 box(x-2.61,1.75,z,.12,2.1,3.4,darkMetal);
 box(x+2.61,1.75,z,.12,2.1,3.4,darkMetal);

 cylinder(x,1.65,z+1.95,.82,.82,1.05,darkMetal,24);
 cylinder(x,1.65,z+2.51,.68,.68,.12,metalMat,24);
 cylinder(x,1.65,z+2.59,.4,.4,.08,blackMat,20);

 for(let i=0;i<4;i++){
  cylinder(x,1.65,z+2.08+i*.12,.84,.84,.045,metalMat,24);
 }

 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  cylinder(x+Math.cos(a)*.57,1.65+Math.sin(a)*.57,z+2.62,.055,.055,.045,darkMetal,8);
 }

 box(x,3.22,z,3.7,.15,2.5,metalMat);

 for(let i=0;i<9;i++){
  box(x-2.69,.95+i*.18,z-.95,.08,.075,1.7,metalMat);
  box(x+2.69,.95+i*.18,z-.95,.08,.075,1.7,metalMat);
 }

 box(x,2.35,z+1.91,1.65,1.2,.16,darkMetal);
 box(x,2.4,z+2.01,1.35,.72,.07,blackMat);
 box(x,2.48,z+2.06,.82,.35,.04,screenMat);
 box(x-.48,1.97,z+2.07,.14,.14,.06,greenMat);
 box(x-.2,1.97,z+2.07,.14,.14,.06,orangeMat);
 box(x+.08,1.97,z+2.07,.14,.14,.06,redLightMat);

 for(let i=0;i<3;i++){
  cylinder(x-.45+i*.45,1.65,z+2.05,.09,.09,.07,darkMetal,12);
 }

 box(x,3.35,z+1.65,.85,.2,.08,yellowMat);

 for(const sx of [-2.42,2.42]){
  for(const sy of [.8,2.7]){
   cylinder(x+sx,sy,z+1.87,.065,.065,.08,darkMetal,8);
  }
 }

 for(let i=0;i<3;i++){
  const px=x-1.5+i*1.5;
  cylinder(px,3.48,z-.7,.16,.16,.6,metalMat);
  cylinder(px,3.8,z-.7,.12,.12,.1,darkMetal);
 }

 pipe(x+2.65,2.5,z-.8,x+3.4,2.5,z-.8,.2);
 pipe(x+3.4,2.5,z-.8,x+3.4,3.4,z-.8,.2);

 for(let i=0;i<3;i++){
  box(x-1+i,3.4,z-1.5,.45,.12,.5,darkMetal);
 }
}

}

 pipe(-55,11,z,55,11,z,.1);

}

for(let x=-55;x<=55;x+=10)box(x,15.4,0,.3,.3,98,metalMat);
for(let z=-45;z<=45;z+=10)box(0,15.4,z,118,.3,.3,metalMat);

for(let x of [-50,-40,-20,20,40,50]){

  box(x,1,z,.95,.35,.95,metalMat);

}

 box(-55,5,z,.5,10,.5,metalMat);
 box(55,5,z,.5,10,.5,metalMat);
 pipe(-55,1,z,-55,12,z,.09,darkMetal);
 pipe(55,1,z,55,12,z,.09,darkMetal);
}

// ESCADA
const stairSteps=16,stairRise=.25,stairDepth=.75;

function createStairFlight(x,zStart,direction,yStart){
 const totalLength=stairSteps*stairDepth;
 const endZ=zStart+direction*totalLength;
 const endY=yStart+stairSteps*stairRise;
 const sideOffset=3.6/2+.12;

 for(let i=0;i<stairSteps;i++){
  const z=zStart+direction*(i*stairDepth+stairDepth/2);
  const y=yStart+(i+1)*stairRise;
  box(x,y-.1,z,3.6,.2,stairDepth,metalMat);
  box(x,y+.006,z+direction*stairDepth*.28,3.42,.025,.07,darkMetal);
  box(x,y-.24,z,3.35,.12,.16,darkMetal);
 }

 for(const side of [-1,1]){
  const railX=x+side*sideOffset;
  pipe(railX,yStart-.1,zStart,railX,endY-.1,endZ,.16,darkMetal);

  for(let i=0;i<=stairSteps;i+=4){
   const t=i/stairSteps;
   const z=zStart+direction*t*totalLength;
   const y=yStart+t*stairSteps*stairRise;
   pipe(railX,y+.05,z,railX,y+1.05,z,.065,metalMat);
  }

  pipe(railX,yStart+1.05,zStart,railX,endY+1.05,endZ,.085,metalMat);
  pipe(railX,yStart+.55,zStart,railX,endY+.55,endZ,.045,darkMetal);
 }
}

createStairFlight(24.5,17,-1,0);
createStairFlight(29.5,5,1,4);

box(27,4,4.65,9.5,.3,3.2,metalMat);
box(27,3.78,4.65,8.8,.12,2.6,darkMetal);

box(29.5,7.78,19,8.5,.12,6.5,darkMetal);

for(const x of [25.2,33.8]){
 pipe(x,8.2,17,x,9.25,17,.07,metalMat);
 pipe(x,8.2,21,x,9.25,21,.07,metalMat);
 pipe(x,9.25,17,x,9.25,21,.07,metalMat);
 pipe(x,8.75,17,x,8.75,21,.045,darkMetal);
}

for(let z=17;z<=21;z+=2){
 pipe(25.2,8.2,z,25.2,9.25,z,.06,metalMat);

}

}

}

for(const z of [16.35,21.65]){

 pipe(10,9.35,z,29.5,9.35,z,.085,metalMat);

}

box(19.5,8.19,16.48,18,.035,.12,yellowMat);
box(19.5,8.19,21.52,18,.035,.12,yellowMat);

box(9.75,10,19,.45,3.5,4.7,darkMetal);
box(9.48,10,19,.08,2.8,4.2,metalMat);
box(9.42,10.45,19,.08,1.25,1.9,blackMat);
box(9.36,10.45,19,.035,.95,1.55,screenMat);

for(let i=0;i<4;i++)box(9.35,9.45,17.85+i*.75,.06,.16,.16,darkMetal);
for(let i=0;i<5;i++)cylinder(9.35,9.05,17.6+i*.7,.09,.09,.07,darkMetal,12);
for(let i=0;i<7;i++)box(9.34,11.65,17.8+i*.4,.05,.055,.24,metalMat);

box(18,13,19,1.3,.12,.5,darkMetal);
box(11,13,19,1.3,.12,.5,darkMetal);
box(18,9.65,16.4,2.4,.35,.08,yellowMat);
box(18,9.65,21.6,2.4,.35,.08,yellowMat);

// MOCHILA E OBJETOS
const items=[];
const backpack=[null,null,null,null];
let heldItem=null;
let flashlightOn=false;
let battery=100;
let backpackOpen=false;
let selectedSlot=-1;

const handGroup=new THREE.Group();
camera.add(handGroup);

const handMesh=new THREE.Mesh(
 new THREE.BoxGeometry(.13,.16,.24),
 mat(0x92745e)
);
handMesh.position.set(.38,-.32,-.55);

function makeFlashlight(){
 const group=new THREE.Group();
 const casing=mat(0x20252b,.55,.7);
 const glass=new THREE.MeshStandardMaterial({
  color:0xffffff,
  emissive:0xffffff,
  emissiveIntensity:1.5,
  roughness:.25
 });

 const handle=new THREE.Mesh(
  new THREE.CylinderGeometry(.065,.075,.42,12),casing
 );
 handle.rotation.x=Math.PI/2;
 group.add(handle);

 const head=new THREE.Mesh(
  new THREE.CylinderGeometry(.11,.075,.13,16),casing
 );
 head.rotation.x=Math.PI/2;
 head.position.z=-.23;
 group.add(head);

 const lens=new THREE.Mesh(
  new THREE.CircleGeometry(.075,20),
  glass
 );
 lens.position.z=-.3;
 group.add(lens);

 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(.085,.018,6,16),metalMat
 );
 rim.position.z=-.3;
 group.add(rim);

 group.scale.set(.85,.85,.85);
 return group;
}

const flashlight=makeFlashlight();
flashlight.userData.name="Lanterna";
flashlight.userData.type="flashlight";
flashlight.userData.pickable=true;
flashlight.userData.isFlashlight=true;
flashlight.visible=false;
camera.add(flashlight);
backpack[0]=flashlight;

// SISTEMA DE LANTERNA
const spotTarget=new THREE.Object3D();
scene.add(spotTarget);

const spot=new THREE.SpotLight(0xffffff,0,16,Math.PI/7,.55,2);
spot.castShadow=false;
spot.target=spotTarget;
scene.add(spot);

const nearLight=new THREE.PointLight(0xffffff,0,7,2);
nearLight.castShadow=false;
scene.add(nearLight);

const flashLight=new THREE.PointLight(0xfff4df,0,5,2);
flashLight.castShadow=false;
scene.add(flashLight);

const beamMaterial=new THREE.MeshBasicMaterial({
 color:0xffffff,transparent:true,opacity:0,
 side:THREE.DoubleSide,depthWrite:false
});

const beamGeometry=new THREE.ConeGeometry(1.35,12,16,1,true);
const visibleBeam=new THREE.Mesh(beamGeometry,beamMaterial);
visibleBeam.rotation.x=-Math.PI/2;
visibleBeam.position.set(.38,-.3,-6.5);
visibleBeam.renderOrder=2;
camera.add(visibleBeam);

const lensGlow=new THREE.Mesh(
 new THREE.SphereGeometry(.12,12,12),
 new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0})
);
lensGlow.position.set(.38,-.3,-.95);
camera.add(lensGlow);

const lightDirection=new THREE.Vector3();
const lightPosition=new THREE.Vector3();

function updateFlashlightDirection(){
 camera.updateMatrixWorld(true);
 camera.getWorldDirection(lightDirection);
 camera.getWorldPosition(lightPosition);

 spot.position.copy(lightPosition);
 spotTarget.position.copy(lightPosition).addScaledVector(lightDirection,14);

 nearLight.position.copy(lightPosition).addScaledVector(lightDirection,.7);
 flashLight.position.copy(lightPosition).addScaledVector(lightDirection,1.5);

 spotTarget.updateMatrixWorld(true);
 spot.updateMatrixWorld(true);
 nearLight.updateMatrixWorld(true);
 flashLight.updateMatrixWorld(true);
}

function updateFlashlightPower(){
 const level=Math.max(0,Math.min(1,battery/100));
 const fade=Math.pow(level,1.5);

 spot.intensity=flashlightOn?42*fade:0;
 nearLight.intensity=flashlightOn?7*fade:0;
 flashLight.intensity=flashlightOn?2.2*fade:0;

 beamMaterial.opacity=flashlightOn?.035*fade:0;
 lensGlow.material.opacity=flashlightOn?fade:0;
}

function setFlashlightPower(on){
 flashlightOn=on;
 updateFlashlightPower();

 document.getElementById("lightButton").textContent=
  on?"APAGAR [F]":"LANTERNA [F]";

 updateFlashlightDirection();
}

function renderBackpack(){
 const slots=document.getElementById("backpackSlots");
 slots.innerHTML="";

 backpack.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="backpackSlot"+(selectedSlot===index?" selected":"");
  div.innerHTML=item
   ?"<strong>🔦</strong><span>"+item.userData.name+"</span>"
   :"<span>VAZIO</span>";

  div.addEventListener("click",()=>selectBackpackSlot(index));
  slots.appendChild(div);
 });
}

function updateBattery(){
 document.getElementById("batteryNumber").textContent=Math.ceil(battery)+"%";
 document.getElementById("batteryFill").style.width=battery+"%";
}

function message(text){
 const el=document.getElementById("message");
 el.textContent=text;
 clearTimeout(message.timer);
 message.timer=setTimeout(()=>el.textContent="",2200);
}

function updateInventoryText(){
 document.getElementById("inventoryText").textContent=
 "MOCHILA: I | OBJETO: "+(heldItem?heldItem.userData.name:"NENHUM");
}

function toggleBackpack(){
 backpackOpen=!backpackOpen;
 document.getElementById("backpackPanel").style.display=
  backpackOpen?"block":"none";

 if(backpackOpen)renderBackpack();
}

function selectBackpackSlot(index){
 const item=backpack[index];

 if(!item){
  message("ESPAÇO VAZIO");
  return;
 }

 if(heldItem){
  message("GUARDE OU SOLTE O OBJETO PRIMEIRO");
  return;
 }

 backpack[index]=null;
 heldItem=item;
 selectedSlot=index;

 item.visible=true;
 item.position.set(.38,-.3,-.65);
 item.rotation.set(0,0,0);
 item.scale.set(.85,.85,.85);
 camera.add(item);

 if(item.userData.isFlashlight){
  item.position.set(.38,-.3,-.68);
 }

 backpackOpen=false;
 document.getElementById("backpackPanel").style.display="none";

 renderBackpack();
 updateInventoryText();
 message("OBJETO RETIRADO DA MOCHILA");
}

function toggleFlashlight(){
 if(!heldItem||!heldItem.userData.isFlashlight){
  message("RETIRE A LANTERNA DA MOCHILA PRIMEIRO");
  return;
 }

 if(flashlightOn){
  setFlashlightPower(false);
 }else{
  if(battery<=0){
   message("BATERIA DESCARREGADA");
   return;
  }
  setFlashlightPower(true);
 }
}

function storeHeldItem(){
 if(!heldItem){
  message("NÃO HÁ OBJETO NA MÃO");
  return;
 }

 const slot=backpack.findIndex(v=>v===null);
 if(slot<0){
  message("MOCHILA CHEIA");
  return;
 }

 if(heldItem.userData.isFlashlight&&flashlightOn){
  setFlashlightPower(false);
 }

 camera.remove(heldItem);
 heldItem.visible=false;
 backpack[slot]=heldItem;
 heldItem=null;

 renderBackpack();
 updateInventoryText();
 message("OBJETO GUARDADO");
}

function dropHeldItem(){
 if(!heldItem){
  message("NÃO HÁ OBJETO NA MÃO");
  return;
 }

 if(heldItem.userData.isFlashlight&&flashlightOn){
  setFlashlightPower(false);
 }

 camera.remove(heldItem);
 scene.add(heldItem);

 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
 heldItem.position.copy(camera.position).add(dir.multiplyScalar(1.4));
 heldItem.position.y=Math.max(.25,playerY+.4);
 heldItem.visible=true;

 items.push(heldItem);
 heldItem=null;

 updateInventoryText();
 message("OBJETO SOLTO");
}

function findNearestItem(){
 let best=null,bestDist=2.7;

 for(const item of items){
  if(!item.visible)continue;
  const d=item.position.distanceTo(camera.position);

  if(d<bestDist){
   best=item;
   bestDist=d;
  }
 }

 return best;
}

function pickItem(){
 if(heldItem){
  message("SUAS MÃOS JÁ ESTÃO OCUPADAS");
  return;
 }

 const item=findNearestItem();

 if(!item){
  message("NÃO HÁ OBJETO PRÓXIMO");
  return;
 }

 const i=items.indexOf(item);
 if(i>=0)items.splice(i,1);

 scene.remove(item);
 camera.add(item);

 item.position.set(.38,-.3,-.65);
 item.rotation.set(0,0,0);
 item.visible=true;

 heldItem=item;

 updateInventoryText();
 message("OBJETO PEGADO");
}

document.getElementById("bagButton").onclick=toggleBackpack;
document.getElementById("closeBag").onclick=toggleBackpack;
document.getElementById("lightButton").onclick=toggleFlashlight;
document.getElementById("storeButton").onclick=storeHeldItem;
document.getElementById("dropButton").onclick=dropHeldItem;
document.getElementById("useButton").onclick=pickItem;

// JOGADOR
let playerY=0;

function getFloorHeight(x,z){
 if(x>=22.45&&x<=26.55&&z>=5&&z<=17){
  return THREE.MathUtils.clamp((17-z)/12,0,1)*4;
 }

 if(x>=27.45&&x<=31.55&&z>=5&&z<=17){
  return 4+THREE.MathUtils.clamp((z-5)/12,0,1)*4;
 }

 if(x>=25.3&&x<=28.7&&z>=3.3&&z<=4.8)return 4;

 if(playerY>=7.2&&x>=25&&x<=34&&z>=17&&z<=22.5)return 8;
 if(playerY>=7.2&&x>=10&&x<=25.8&&z>=16.4&&z<=21.6)return 8;

 return 0;
}

const player=new THREE.Vector3(0,0,35);
let yaw=0,pitch=0;
const keys={};
let started=false;

function start(){
 started=true;
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";

 camera.position.set(player.x,1.7,player.z);
 camera.rotation.order="YXZ";

 updateFlashlightDirection();

 if(innerWidth>700){
  renderer.domElement.requestPointerLock?.();
 }
}

document.getElementById("play").addEventListener("click",start);

const keyMap={
 KeyW:"w",ArrowUp:"w",
 KeyS:"s",ArrowDown:"s",
 KeyA:"a",ArrowLeft:"a",
 KeyD:"d",ArrowRight:"d"
};

addEventListener("keydown",e=>{
 if(keyMap[e.code]){
  keys[keyMap[e.code]]=true;
  e.preventDefault();
 }

 if(!started)return;

 if(e.code==="KeyI")toggleBackpack();
 if(e.code==="KeyF")toggleFlashlight();
 if(e.code==="KeyE")pickItem();
 if(e.code==="KeyG")storeHeldItem();
 if(e.code==="KeyQ")dropHeldItem();

 if(e.code==="Digit1")selectBackpackSlot(0);
 if(e.code==="Digit2")selectBackpackSlot(1);
 if(e.code==="Digit3")selectBackpackSlot(2);
 if(e.code==="Digit4")selectBackpackSlot(3);
});

addEventListener("keyup",e=>{
 if(keyMap[e.code])keys[keyMap[e.code]]=false;
});

// CONTROLES MOBILE REFORÇADOS
const padMap={
 up:"w",
 down:"s",
 left:"a",
 right:"d"
};

const activePointers=new Map();

function updatePadKey(key){
 keys[key]=[...activePointers.values()].includes(key);
}

document.querySelectorAll(".pad button").forEach(button=>{
 const key=padMap[button.id];
 if(!key)return;

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  e.stopPropagation();

  activePointers.set(e.pointerId,key);
  keys[key]=true;

  try{
   button.setPointerCapture(e.pointerId);
  }catch(error){}
 });

 function release(e){
  if(!activePointers.has(e.pointerId))return;

  activePointers.delete(e.pointerId);
  updatePadKey(key);
 }

 button.addEventListener("pointerup",release);
 button.addEventListener("pointercancel",release);
 button.addEventListener("lostpointercapture",release);

 // Fallback para navegadores móveis
 button.addEventListener("contextmenu",e=>e.preventDefault());
});

function clearMovement(){
 activePointers.clear();
 keys.w=false;
 keys.a=false;
 keys.s=false;
 keys.d=false;
}

window.addEventListener("blur",clearMovement);
document.addEventListener("visibilitychange",()=>{
 if(document.hidden)clearMovement();
});

// CÂMERA POR ARRASTO DIRETO NA TELA
let touchId=null,lastX=0,lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(!started||e.pointerType!=="touch")return;

 touchId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;

 try{
  renderer.domElement.setPointerCapture(e.pointerId);
 }catch(error){}
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(touchId!==e.pointerId)return;

 yaw-=(e.clientX-lastX)*.006;
 pitch-=(e.clientY-lastY)*.004;
 pitch=THREE.MathUtils.clamp(pitch,-1.2,1.2);

 lastX=e.clientX;
 lastY=e.clientY;
});

function stopTouch(e){
 if(touchId===e.pointerId)touchId=null;
}

renderer.domElement.addEventListener("pointerup",stopTouch);
renderer.domElement.addEventListener("pointercancel",stopTouch);

renderer.domElement.addEventListener("click",()=>{
 if(started&&innerWidth>700){
  renderer.domElement.requestPointerLock?.();
 }
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.002;
  pitch=THREE.MathUtils.clamp(
   pitch-e.movementY*.002,
   -1.2,
   1.2
  );
 }
});

// LOOP PRINCIPAL
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(started){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();

  if(keys.w)move.add(forward);
  if(keys.s)move.sub(forward);
  if(keys.d)move.add(right);
  if(keys.a)move.sub(right);

  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(5*dt);
   player.add(move);
  }

  player.x=THREE.MathUtils.clamp(player.x,-58.5,58.5);
  player.z=THREE.MathUtils.clamp(player.z,-48.5,48.5);

  const targetHeight=getFloorHeight(player.x,player.z);
  playerY+=(targetHeight-playerY)*Math.min(1,dt*12);

  if(Math.abs(targetHeight-playerY)<.025){
   playerY=targetHeight;
  }

  camera.position.set(player.x,playerY+1.7,player.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  if(flashlightOn){
   updateFlashlightDirection();

   battery=Math.max(0,battery-dt*.12);
   updateFlashlightPower();

   if(battery===0){
    setFlashlightPower(false);
    message("A BATERIA DA LANTERNA ACABOU");
   }

   updateBattery();
  }
 }

 renderer.render(scene,camera);
}

animate();

renderBackpack();
updateBattery();
updateInventoryText();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
});

})();
</script>
</body>
</html>
