
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ENCONTRE UMA SAÍDA! — SALA 02</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080a0d;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(#252a30,#080a0d 75%);
}
h1{font-size:clamp(28px,6vw,52px)}
h1 span{color:#d71920}
#menu p{color:#aaa;letter-spacing:2px;font-size:12px}
button{
 background:#a80f18;color:white;border:1px solid #ed4545;
 padding:13px 22px;border-radius:4px;font-weight:bold;
 touch-action:none;
}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:15px;left:15px;font-size:13px;letter-spacing:2px}
#controls{position:absolute;bottom:20px;left:15px;pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,53px);grid-template-rows:repeat(2,53px);gap:5px}
.pad button{padding:0;background:#252a30cc;border-color:#777;font-size:20px}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#crosshair{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:7px;height:7px;border:1px solid #ddd;border-radius:50%;
}
#footer{position:absolute;bottom:8px;width:100%;text-align:center;color:#777;font-size:10px}
</style>
</head>
<body>

<div id="menu">
 <h1>ENCONTRE UMA <span>SAÍDA!</span></h1>
 <p>AB GAMES APRESENTA</p>
 <h2>SALA 02 — V1.2</h2>
 <p>INSTALAÇÃO DE ENERGIA</p>
 <button id="play">ENTRAR NA SALA</button>
 <p>PC: WASD + MOUSE<br>CELULAR: BOTÕES + ARRASTAR NA TELA</p>
</div>

<div id="hud">
 <div id="brand">AB GAMES // SALA 02</div>
 <div id="crosshair"></div>
 <div id="controls">
  <div class="pad">
   <button id="up">▲</button>
   <button id="left">◀</button>
   <button id="down">▼</button>
   <button id="right">▶</button>
  </div>
 </div>
 <div id="footer">ENCONTRE UMA SAÍDA! — AB GAMES</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){
 document.getElementById("menu").innerHTML="<h2>Erro ao carregar o jogo</h2><p>Verifique sua conexão.</p>";
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c11);
scene.fog=new THREE.Fog(0x090c11,25,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

const floorMat=mat(0x30343a);
const wallMat=mat(0x242930);
const metalMat=mat(0x626b73,.65,.65);
const darkMat=mat(0x11161b);
const yellowMat=mat(0xd3a52b);
const generatorMat=mat(0x343d45,.7,.55);
const panelMat=mat(0x11191e);

function box(x,y,z,w,h,d,material){
 const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

function cylinder(x,y,z,r1,r2,h,material,segments=12){
 const obj=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,segments),material
 );
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

// SALA
box(0,-.25,0,40,.5,32,floorMat);

// PAREDES
box(0,8,-16,40,16,.5,wallMat);
box(0,8,16,40,16,.5,wallMat);
box(-20,8,0,.5,16,32,wallMat);
box(20,8,0,.5,16,32,wallMat);

// TETO
box(0,16,0,40,.5,32,wallMat);

// ILUMINAÇÃO BÁSICA
scene.add(new THREE.HemisphereLight(0xb5c4d5,0x303039,.85));

const ceilingLight=new THREE.PointLight(0xb5c9df,75,48);
ceilingLight.position.set(0,13,0);
scene.add(ceilingLight);

const sideLight=new THREE.PointLight(0x65778d,25,35);
sideLight.position.set(-12,8,-5);
scene.add(sideLight);

// GERADORES INDUSTRIAIS
function createGenerator(x,z,number){

 // Base
 box(x,.18,z,5.2,.35,3.9,darkMat);

 // Corpo principal
 box(x,1.65,z,4.6,2.6,3.4,generatorMat);

 // Parte superior
 box(x,3.02,z,4.3,.22,3.2,metalMat);

 // Laterais
 box(x-2.32,1.7,z,.18,2.2,3.2,metalMat);
 box(x+2.32,1.7,z,.18,2.2,3.2,metalMat);

 // Painel frontal
 box(x,1.65,z+1.76,2.4,1.65,.13,panelMat);

 // Tela
 const screen=box(x,2.1,z+1.85,.95,.48,.06,mat(0x174653));
 screen.material.emissive=new THREE.Color(0x08232a);
 screen.material.emissiveIntensity=.6;

 // Indicadores
 for(let i=0;i<4;i++){
  const light=box(
   x-0.8+i*.53,1.3,z+1.86,
   .16,.16,.07,
   i===0?mat(0x1e9b61):mat(0xd0a12a)
  );
  light.material.emissive=light.material.color.clone();
  light.material.emissiveIntensity=.35;
 }

 // Grades laterais
 for(let i=0;i<6;i++){
  box(
   x-1.25+i*.5,.85,z+1.86,
   .09,.7,.08,metalMat
  );
 }

 // Tubos no topo
 for(let i=0;i<3;i++){
  const px=x-1.2+i*1.2;
  cylinder(px,3.35,z,.16,.16,.55,metalMat);
  cylinder(px,3.72,z,.13,.13,.2,yellowMat);
 }

 // Tubos de saída na lateral
 cylinder(x+2.55,2.1,z,.2,.2,1.1,metalMat);
 cylinder(x+3.1,2.1,z,.16,.16,.2,yellowMat);

 // Tampa circular frontal
 const cover=cylinder(x,1.65,z+1.92,.42,.42,.12,metalMat,20);
 cover.rotation.x=Math.PI/2;

 // Parafusos visuais
 for(let i=0;i<4;i++){
  const sx=x+(i%2===0?-1.05:1.05);
  const sy=i<2?2.35:.95;
  box(sx,sy,z+1.87,.09,.09,.08,yellowMat);
 }

 // Identificação
 box(x,3.2,z+1.6,.65,.16,.08,yellowMat);

}

// POSIÇÃO DOS TRÊS GERADORES
createGenerator(-11,-7,1);
createGenerator(0,-7,2);
createGenerator(11,-7,3);

// TUBULAÇÕES BÁSICAS LIGADAS AOS GERADORES
function pipe(x1,y1,z1,x2,y2,z2,r){
 const a=new THREE.Vector3(x1,y1,z1);
 const b=new THREE.Vector3(x2,y2,z2);
 const dir=new THREE.Vector3().subVectors(b,a);

 const obj=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,dir.length(),10),
  metalMat
 );

 obj.position.copy(a).add(b).multiplyScalar(.5);
 obj.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),
  dir.normalize()
 );
 scene.add(obj);
}

// Tubos conectando as partes superiores
pipe(-11,3.8,-7,0,3.8,-7,.13);
pipe(0,3.8,-7,11,3.8,-7,.13);

// Tubos de subida
for(const x of [-11,0,11]){
 pipe(x,3.8,-7,x,5.5,-7,.12);
}

// Jogador
const player=new THREE.Vector3(0,0,10);
let yaw=0,pitch=0;
const keys={};
let started=false;

function start(){
 started=true;
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";
 camera.position.set(player.x,1.7,player.z);
}

document.getElementById("play").addEventListener("click",start);

// TECLADO
const keyMap={
 KeyW:"w",ArrowUp:"w",
 KeyS:"s",ArrowDown:"s",
 KeyA:"a",ArrowLeft:"a",
 KeyD:"d",ArrowRight:"d"
};

addEventListener("keydown",e=>{
 if(keyMap[e.code]){
  keys[keyMap[e.code]]=true;
  e.preventDefault();
 }
});

addEventListener("keyup",e=>{
 if(keyMap[e.code])keys[keyMap[e.code]]=false;
});

// CONTROLES CELULAR
const padMap={up:"w",down:"s",left:"a",right:"d"};

document.querySelectorAll(".pad button").forEach(button=>{
 const key=padMap[button.id];

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  button.addEventListener(event,()=>keys[key]=false);
 });
});

// CÂMERA POR ARRASTO NA TELA
let touchId=null;
let lastX=0,lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(!started || e.pointerType!=="touch")return;

 touchId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(touchId!==e.pointerId)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 yaw-=dx*.006;
 pitch-=dy*.004;

 pitch=Math.max(-1.2,Math.min(1.2,pitch));

 lastX=e.clientX;
 lastY=e.clientY;
});

function stopTouch(e){
 if(touchId===e.pointerId)touchId=null;
}

renderer.domElement.addEventListener("pointerup",stopTouch);
renderer.domElement.addEventListener("pointercancel",stopTouch);

// MOUSE PC
renderer.domElement.addEventListener("click",()=>{
 if(started && innerWidth>700){
  renderer.domElement.requestPointerLock?.();
 }
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
 }
});

// MOVIMENTO
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(started){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();

  if(keys.w)move.add(forward);
  if(keys.s)move.sub(forward);
  if(keys.d)move.add(right);
  if(keys.a)move.sub(right);

  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(5*dt);
   player.add(move);
  }

  player.x=THREE.MathUtils.clamp(player.x,-18.5,18.5);
  player.z=THREE.MathUtils.clamp(player.z,-14.5,14.5);

  camera.position.set(player.x,1.7,player.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
 }

 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

})();
</script>
</body>
</html>
