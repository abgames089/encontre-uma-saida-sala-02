<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ENCONTRE UMA SAÍDA! — SALA 02</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#080a0d;
 font-family:Arial;color:white;touch-action:none
}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(#252a30,#080a0d 75%);
}
h1{font-size:clamp(28px,6vw,52px)}
h1 span{color:#d71920}
#menu p{color:#aaa;letter-spacing:2px;font-size:12px}
button{
 background:#a80f18;color:white;border:1px solid #ed4545;
 padding:13px 22px;border-radius:4px;font-weight:bold;
 touch-action:none;
}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:15px;left:15px;font-size:13px;letter-spacing:2px}
#controls{position:absolute;bottom:20px;left:15px;pointer-events:auto}
.pad{
 display:grid;
 grid-template-columns:repeat(3,53px);
 grid-template-rows:repeat(2,53px);gap:5px
}
.pad button{
 padding:0;background:#252a30cc;
 border-color:#777;font-size:20px
}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#crosshair{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:7px;height:7px;border:1px solid #ddd;border-radius:50%;
}
#footer{
 position:absolute;bottom:8px;width:100%;
 text-align:center;color:#777;font-size:10px
}
#doorPrompt{
 position:absolute;left:50%;bottom:105px;transform:translateX(-50%);
 display:none;background:#090d11dd;border:1px solid #a80f18;
 padding:10px 14px;border-radius:4px;font-size:13px;text-align:center;
}
#interact{
 display:none;position:absolute;right:18px;bottom:28px;
 pointer-events:auto;padding:14px 18px;
}
#passwordModal{
 display:none;position:fixed;inset:0;z-index:10;
 align-items:center;justify-content:center;
 background:#000b;pointer-events:auto;padding:16px;
}
#passwordBox{
 width:min(330px,100%);background:#151a20;
 border:1px solid #a80f18;border-radius:8px;
 padding:18px;box-shadow:0 12px 40px #000;
 text-align:center;
}
#passwordBox h2{margin:0 0 8px;font-size:19px}
#passwordDisplay{
 background:#05080b;border:1px solid #58616a;
 color:#65e6c1;letter-spacing:9px;font-size:25px;
 padding:12px;margin:14px 0;font-family:monospace;
 min-height:52px;
}
#keypadButtons{
 display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
#keypadButtons button{
 padding:14px 8px;background:#252c34;border-color:#68727d;
 font-size:17px;
}
#keypadButtons button.action{background:#8d1119;border-color:#e34b50}
#passwordStatus{min-height:20px;color:#f0b5b5;font-size:12px;margin:10px 0}
#closePassword{margin-top:8px;background:#343a40;border-color:#777}
</style>
</head>

<body>

<div id="menu">
 <h1>ENCONTRE UMA <span>SAÍDA!</span></h1>
 <p>AB GAMES APRESENTA</p>
 <h2>SALA 02 — V1.3</h2>
 <p>INSTALAÇÃO DE ENERGIA</p>
 <button id="play">ENTRAR NA SALA</button>
 <p>PC: WASD + MOUSE<br>CELULAR: BOTÕES + ARRASTAR NA TELA</p>
</div>

<div id="hud">
 <div id="brand">AB GAMES // SALA 02</div>
 <div id="crosshair"></div>

 <div id="controls">
  <div class="pad">
   <button id="up">▲</button>
   <button id="left">◀</button>
   <button id="down">▼</button>
   <button id="right">▶</button>
  </div>
 </div>

 <div id="footer">ENCONTRE UMA SAÍDA! — AB GAMES</div>
</div>

<div id="doorPrompt">
 PORTA BLOQUEADA — pressione <b>E</b> ou toque em INTERAGIR
</div>

<button id="interact">INTERAGIR</button>

<div id="passwordModal">
 <div id="passwordBox">
  <h2>CONTROLE DE ACESSO</h2>
  <p style="color:#aaa;font-size:12px">DIGITE A SENHA DE 4 DÍGITOS</p>

  <div id="passwordDisplay">----</div>

  <div id="keypadButtons">
   <button data-key="1">1</button>
   <button data-key="2">2</button>
   <button data-key="3">3</button>

   <button data-key="4">4</button>
   <button data-key="5">5</button>
   <button data-key="6">6</button>

   <button data-key="7">7</button>
   <button data-key="8">8</button>
   <button data-key="9">9</button>

   <button data-key="clear">LIMPAR</button>
   <button data-key="0">0</button>
   <button data-key="back">⌫</button>

   <button class="action" data-key="confirm" style="grid-column:span 3">
    CONFIRMAR
   </button>
  </div>

  <div id="passwordStatus"></div>
  <button id="closePassword">FECHAR</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
(()=>{
if(!window.THREE){
 document.getElementById("menu").innerHTML=
 "<h2>Erro ao carregar o jogo</h2><p>Verifique sua conexão.</p>";
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c11);
scene.fog=new THREE.Fog(0x090c11,45,105);

const camera=new THREE.PerspectiveCamera(
 75,innerWidth/innerHeight,.1,150
);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// MATERIAIS
function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({
  color,roughness,metalness
 });
}

const floorMat=mat(0x30343a);
const wallMat=mat(0x242930);
const metalMat=mat(0x65717b,.65,.7);
const darkMetal=mat(0x171d23,.8,.5);
const blackMat=mat(0x090d11);
const yellowMat=mat(0xd1a12a);
const bodyMat=mat(0x39444b,.65,.55);
const rubberMat=mat(0x16191c);
const redMat=mat(0x8e151b);

const screenMat=new THREE.MeshStandardMaterial({
 color:0x17404a,
 emissive:0x09242d,
 emissiveIntensity:.8
});

const greenMat=new THREE.MeshStandardMaterial({
 color:0x178b55,
 emissive:0x07552b,
 emissiveIntensity:.8
});

const orangeMat=new THREE.MeshStandardMaterial({
 color:0xc17b21,
 emissive:0x5c3105,
 emissiveIntensity:.7
});

// FUNÇÕES 3D
function box(x,y,z,w,h,d,material){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

function cylinder(x,y,z,r1,r2,h,material,segments=16){
 const obj=new THREE.Mesh(
  new THREE.CylinderGeometry(r1,r2,h,segments),
  material
 );
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

function pipe(x1,y1,z1,x2,y2,z2,r,material=metalMat){
 const a=new THREE.Vector3(x1,y1,z1);
 const b=new THREE.Vector3(x2,y2,z2);
 const dir=new THREE.Vector3().subVectors(b,a);

 const obj=new THREE.Mesh(
  new THREE.CylinderGeometry(r,r,dir.length(),12),
  material
 );

 obj.position.copy(a).add(b).multiplyScalar(.5);

 obj.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),dir.normalize()
 );

 scene.add(obj);
 return obj;
}

// ESTRUTURA DA SALA — 70 x 55
box(0,-.25,0,70,.5,55,floorMat);

// PAREDES
box(-18.75,8,-27.5,32.5,16,.5,wallMat);
box(18.75,8,-27.5,32.5,16,.5,wallMat);
box(0,11.75,-27.5,5,8.5,.5,wallMat);

box(0,8,27.5,70,16,.5,wallMat);
box(-35,8,0,.5,16,55,wallMat);
box(35,8,0,.5,16,55,wallMat);

// PORTA INDUSTRIAL E PAINEL NUMÉRICO
const doorPivot=new THREE.Group();
doorPivot.position.set(-2.4,0,-27.15);
scene.add(doorPivot);

const doorLeaf=new THREE.Mesh(
 new THREE.BoxGeometry(4.8,7.3,.28),darkMetal
);

doorLeaf.position.set(2.4,3.65,0);
doorPivot.add(doorLeaf);

// Reforços metálicos da porta
for(const y of [1,3.65,6.3]){
 const bar=new THREE.Mesh(
  new THREE.BoxGeometry(4.35,.16,.34),metalMat
 );

 bar.position.set(2.4,y,.02);
 doorPivot.add(bar);
}

for(const x of [.55,4.25]){
 const bar=new THREE.Mesh(
  new THREE.BoxGeometry(.14,6.9,.34),metalMat
 );

 bar.position.set(x,3.65,.02);
 doorPivot.add(bar);
}

const doorSign=new THREE.Mesh(
 new THREE.BoxGeometry(1.45,.55,.08),yellowMat
);

doorSign.position.set(2.4,6.55,.2);
doorPivot.add(doorSign);

// Batentes
box(-2.55,3.75,-27.12,.18,7.7,.35,metalMat);
box(2.55,3.75,-27.12,.18,7.7,.35,metalMat);
box(0,7.55,-27.12,5.25,.18,.35,metalMat);

// Painel eletrônico ao lado direito da porta
box(3.55,1.65,-27.05,.95,1.45,.22,darkMetal);
box(3.55,2.02,-26.91,.68,.32,.06,screenMat);

for(let row=0;row<3;row++){
 for(let col=0;col<3;col++){
  box(3.31+col*.24,1.58-row*.25,-26.91,.15,.14,.07,metalMat);
 }
}

box(3.55,.78,-26.91,.4,.13,.07,redMat);

let doorOpened=false;
let doorAngle=0;

// TETO
box(0,16,0,70,.5,55,wallMat);

// FAIXAS INDUSTRIAIS NAS PAREDES
for(let x=-30;x<=30;x+=10){
 box(x,1,-27.2,3,.18,.08,yellowMat);
 box(x,1,27.2,3,.18,.08,yellowMat);
}

// ILUMINAÇÃO
scene.add(new THREE.HemisphereLight(
 0xb5c4d5,0x303039,.8
));

const ceilingLight=new THREE.PointLight(0xb5c9df,100,65);
ceilingLight.position.set(0,13,0);
scene.add(ceilingLight);

const sideLight1=new THREE.PointLight(0x65778d,35,40);
sideLight1.position.set(-20,9,-8);
scene.add(sideLight1);

const sideLight2=new THREE.PointLight(0x65778d,35,40);
sideLight2.position.set(20,9,8);
scene.add(sideLight2);

// GERADOR INDUSTRIAL DETALHADO
function createGenerator(x,z,id){

 // Base de concreto e metal
 box(x,.16,z,6.2,.32,4.8,darkMetal);
 box(x,.36,z,5.8,.15,4.4,metalMat);

 // Pés de apoio
 for(const sx of [-2.35,2.35]){
  for(const sz of [-1.65,1.65]){
   box(x+sx,.55,z+sz,.42,.45,.42,blackMat);
   box(x+sx,.33,z+sz,.65,.12,.65,metalMat);
  }
 }

 // Corpo central
 box(x,1.75,z,5.15,2.45,3.65,bodyMat);

 // Camada superior
 box(x,3.05,z,4.85,.2,3.4,metalMat);

 // Painéis laterais
 box(x-2.61,1.75,z,.12,2.1,3.4,darkMetal);
 box(x+2.61,1.75,z,.12,2.1,3.4,darkMetal);

 // MOTOR CILÍNDRICO NA FRENTE
 cylinder(x,1.65,z+1.95,.82,.82,1.05,darkMetal,24);
 cylinder(x,1.65,z+2.51,.68,.68,.12,metalMat,24);
 cylinder(x,1.65,z+2.59,.4,.4,.08,blackMat,20);

 // Anéis do motor
 for(let i=0;i<4;i++){
  cylinder(
   x,1.65,z+2.08+i*.12,
   .84,.84,.045,metalMat,24
  );
 }

 // Parafusos do motor
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;

  cylinder(
   x+Math.cos(a)*.57,
   1.65+Math.sin(a)*.57,
   z+2.62,
   .055,.055,.045,yellowMat,8
  );
 }

 // Tampa superior
 box(x,3.22,z,3.7,.15,2.5,metalMat);

 // Grades de ventilação na lateral esquerda
 for(let i=0;i<9;i++){
  box(
   x-2.69,
   .95+i*.18,
   z-.95,
   .08,.075,1.7,metalMat
  );
 }

 // Grades de ventilação na lateral direita
 for(let i=0;i<9;i++){
  box(
   x+2.69,
   .95+i*.18,
   z-.95,
   .08,.075,1.7,metalMat
  );
 }

 // Painel frontal de controle
 box(x,2.35,z+1.91,1.65,1.2,.16,darkMetal);
 box(x,2.4,z+2.01,1.35,.72,.07,blackMat);
 box(x,2.48,z+2.06,.82,.35,.04,screenMat);

 // Luzes de estado
 box(x-.48,1.97,z+2.07,.14,.14,.06,greenMat);
 box(x-.2,1.97,z+2.07,.14,.14,.06,orangeMat);
 box(x+.08,1.97,z+2.07,.14,.14,.06,redMat);

 // Botões de comando
 for(let i=0;i<3;i++){
  cylinder(
   x-.45+i*.45,1.65,z+2.05,
   .09,.09,.07,
   i===0?greenMat:(i===1?yellowMat:redMat),12
  );
 }

 // Placa com número do equipamento
 box(x,3.35,z+1.65,.85,.2,.08,yellowMat);

 // Parafusos externos do corpo
 for(const sx of [-2.42,2.42]){
  for(const sy of [.8,2.7]){
   cylinder(x+sx,sy,z+1.87,.065,.065,.08,yellowMat,8);
  }
 }

 // Tubos superiores de conexão
 for(let i=0;i<3;i++){
  const px=x-1.5+i*1.5;

  cylinder(px,3.48,z-.7,.16,.16,.6,metalMat);
  cylinder(px,3.8,z-.7,.12,.12,.1,yellowMat);
 }

 // Grandes tubos laterais
 pipe(x+2.65,2.5,z-.8,x+3.4,2.5,z-.8,.2);
 pipe(x+3.4,2.5,z-.8,x+3.4,3.4,z-.8,.2);

 // Pequenas saídas de ventilação
 for(let i=0;i<3;i++){
  const px=x-1+i;

  box(px,3.4,z-1.5,.45,.12,.5,darkMetal);
 }

 // Apoios inferiores frontais
 for(let i=-2;i<=2;i++){
  box(x+i*.85,.57,z+2.03,.16,.25,.12,metalMat);
 }
}

// POSIÇÃO DOS GERADORES
createGenerator(-17,-9,1);
createGenerator(0,-9,2);
createGenerator(17,-9,3);

// TUBULAÇÕES PRINCIPAIS
pipe(-17,4,-9,17,4,-9,.18);
pipe(-17,4,-9,-17,5.8,-9,.15);
pipe(0,4,-9,0,5.8,-9,.15);
pipe(17,4,-9,17,5.8,-9,.15);

// Tubos ao fundo da instalação
for(let x=-30;x<=30;x+=10){
 pipe(x,10,-26.5,x,10,26.5,.12);
 pipe(x,10,-26.5,x,10.7,-26.5,.08,yellowMat);
}

// Suportes dos tubos
for(let x=-30;x<=30;x+=10){
 box(x,9.5,-26,.35,1,.35,darkMetal);
 box(x,9.5,26,.35,1,.35,darkMetal);
}

// VIGAS DO TETO
for(let x=-30;x<=30;x+=10){
 box(x,15.4,0,.3,.3,54,metalMat);
}

for(let z=-25;z<=25;z+=10){
 box(0,15.4,z,69,.3,.3,metalMat);
}

// JOGADOR
const player=new THREE.Vector3(0,0,19);
let yaw=0,pitch=0;
const keys={};

let started=false;
const ACCESS_CODE="2402";
let enteredCode="";
let passwordOpen=false;

const passwordModal=document.getElementById("passwordModal");
const passwordDisplay=document.getElementById("passwordDisplay");
const passwordStatus=document.getElementById("passwordStatus");
const doorPrompt=document.getElementById("doorPrompt");
const interactButton=document.getElementById("interact");

function updatePasswordDisplay(){
 passwordDisplay.textContent=enteredCode.padEnd(4,"-");
}

function openPasswordPanel(){
 if(!started || doorOpened)return;

 passwordOpen=true;
 enteredCode="";
 passwordStatus.textContent="";
 passwordStatus.style.color="#f0b5b5";

 updatePasswordDisplay();
 passwordModal.style.display="flex";
}

function closePasswordPanel(){
 passwordOpen=false;
 passwordModal.style.display="none";
}

function confirmPassword(){
 if(enteredCode===ACCESS_CODE){
  doorOpened=true;
  passwordStatus.style.color="#75e6a1";
  passwordStatus.textContent="ACESSO LIBERADO";
  setTimeout(closePasswordPanel,650);
 }else{
  passwordStatus.style.color="#ff7777";
  passwordStatus.textContent="ACESSO NEGADO";
  enteredCode="";
  updatePasswordDisplay();
 }
}

document.querySelectorAll("#keypadButtons button").forEach(button=>{
 button.addEventListener("click",()=>{
  const key=button.dataset.key;

  if(key==="confirm"){
   confirmPassword();
   return;
  }

  if(key==="clear")enteredCode="";
  else if(key==="back")enteredCode=enteredCode.slice(0,-1);
  else if(enteredCode.length<4)enteredCode+=key;

  updatePasswordDisplay();
 });
});

document.getElementById("closePassword").addEventListener("click",closePasswordPanel);
interactButton.addEventListener("click",openPasswordPanel);

function start(){
 started=true;

 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";

 camera.position.set(player.x,1.7,player.z);
}

document.getElementById("play").addEventListener("click",start);

// TECLADO
const keyMap={
 KeyW:"w",ArrowUp:"w",
 KeyS:"s",ArrowDown:"s",
 KeyA:"a",ArrowLeft:"a",
 KeyD:"d",ArrowRight:"d"
};

addEventListener("keydown",e=>{
 if(e.code==="KeyE" && started && !passwordOpen && !doorOpened){
  const near=Math.hypot(player.x-3.55,player.z+26.2)<4.2 ||
              Math.hypot(player.x,player.z+24.8)<3.5;

  if(near)openPasswordPanel();
 }

 if(e.code==="Escape" && passwordOpen)closePasswordPanel();

 if(keyMap[e.code]){
  keys[keyMap[e.code]]=true;
  e.preventDefault();
 }
});

addEventListener("keyup",e=>{
 if(keyMap[e.code])keys[keyMap[e.code]]=false;
});

// CONTROLES CELULAR
const padMap={
 up:"w",
 down:"s",
 left:"a",
 right:"d"
};

document.querySelectorAll(".pad button").forEach(button=>{
 const key=padMap[button.id];

 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  button.addEventListener(event,()=>keys[key]=false);
 });
});

// CÂMERA PELO ARRASTO
let touchId=null;
let lastX=0,lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 if(!started || e.pointerType!=="touch")return;

 touchId=e.pointerId;
 lastX=e.clientX;
 lastY=e.clientY;

 renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener("pointermove",e=>{
 if(touchId!==e.pointerId)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 yaw-=dx*.006;
 pitch-=dy*.004;

 pitch=Math.max(-1.2,Math.min(1.2,pitch));

 lastX=e.clientX;
 lastY=e.clientY;
});

function stopTouch(e){
 if(touchId===e.pointerId)touchId=null;
}

renderer.domElement.addEventListener("pointerup",stopTouch);
renderer.domElement.addEventListener("pointercancel",stopTouch);

// MOUSE PC
renderer.domElement.addEventListener("click",()=>{
 if(started && innerWidth>700){
  renderer.domElement.requestPointerLock?.();
 }
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;

  pitch=Math.max(-1.2,Math.min(1.2,pitch));
 }
});

// MOVIMENTO
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(started){
  const forward=new THREE.Vector3(
   -Math.sin(yaw),0,-Math.cos(yaw)
  );

  const right=new THREE.Vector3(
   Math.cos(yaw),0,-Math.sin(yaw)
  );

  const move=new THREE.Vector3();

  if(keys.w)move.add(forward);
  if(keys.s)move.sub(forward);
  if(keys.d)move.add(right);
  if(keys.a)move.sub(right);

  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(5*dt);
   player.add(move);
  }

  // LIMITES DA SALA
  player.x=THREE.MathUtils.clamp(player.x,-33.5,33.5);
  player.z=THREE.MathUtils.clamp(player.z,-25.5,25.5);

  // A porta bloqueia a passagem até a senha ser aceita
  if(!doorOpened && Math.abs(player.x)<2.9 && player.z< -23.6){
   player.z=-23.6;
  }

  const nearDoor=Math.hypot(player.x-3.55,player.z+26.2)<4.2 ||
                 Math.hypot(player.x,player.z+24.8)<3.5;

  doorPrompt.style.display=(nearDoor && !doorOpened && !passwordOpen)?"block":"none";
  interactButton.style.display=(nearDoor && !doorOpened && !passwordOpen)?"block":"none";

  if(doorOpened && doorAngle<Math.PI/2){
   doorAngle=Math.min(Math.PI/2,doorAngle+dt*1.25);
   doorPivot.rotation.y=-doorAngle;
  }

  camera.position.set(player.x,1.7,player.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
 }

 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

})();
</script>

</body>
</html>
