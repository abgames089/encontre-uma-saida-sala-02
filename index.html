
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ENCONTRE UMA SAÍDA! — SALA 02</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080a0d;font-family:Arial;color:white}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(#252a30,#080a0d 75%);
}
h1{font-size:clamp(28px,6vw,52px)}
h1 span{color:#d71920}
#menu p{color:#aaa;letter-spacing:2px;font-size:12px}
button{
 background:#a80f18;color:white;border:1px solid #ed4545;
 padding:13px 22px;border-radius:4px;font-weight:bold;
 touch-action:none;
}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:15px;left:15px;font-size:13px;letter-spacing:2px}
#controls{position:absolute;bottom:20px;left:15px;pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,53px);grid-template-rows:repeat(2,53px);gap:5px}
.pad button{padding:0;background:#252a30cc;border-color:#777;font-size:20px}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#look{
 position:absolute;right:15px;bottom:25px;
 width:130px;height:130px;border:1px solid #ffffff55;
 border-radius:50%;pointer-events:auto;touch-action:none;
}
#crosshair{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:7px;height:7px;border:1px solid #ddd;border-radius:50%;
}
#footer{position:absolute;bottom:8px;width:100%;text-align:center;color:#777;font-size:10px}
</style>
</head>
<body>

<div id="menu">
 <h1>ENCONTRE UMA <span>SAÍDA!</span></h1>
 <p>AB GAMES APRESENTA</p>
 <h2>SALA 02 — V1.0</h2>
 <p>INSTALAÇÃO DE ENERGIA</p>
 <button id="play">ENTRAR NA SALA</button>
 <p>PC: WASD + MOUSE<br>CELULAR: CONTROLES NA TELA</p>
</div>

<div id="hud">
 <div id="brand">AB GAMES // SALA 02</div>
 <div id="crosshair"></div>
 <div id="controls">
  <div class="pad">
   <button id="up">▲</button>
   <button id="left">◀</button>
   <button id="down">▼</button>
   <button id="right">▶</button>
  </div>
 </div>
 <div id="look"></div>
 <div id="footer">ENCONTRE UMA SAÍDA! — AB GAMES</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){
 document.getElementById("menu").innerHTML="<h2>Erro ao carregar o jogo</h2><p>Verifique sua conexão.</p>";
 return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c11);
scene.fog=new THREE.Fog(0x090c11,25,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const material=new THREE.MeshStandardMaterial({
 color:0x30343a,roughness:.95
});
const wallMaterial=new THREE.MeshStandardMaterial({
 color:0x242930,roughness:1
});

function box(x,y,z,w,h,d,mat){
 const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 obj.position.set(x,y,z);
 scene.add(obj);
 return obj;
}

// SALA VAZIA — DIMENSÕES GRANDES
box(0,-.25,0,40,.5,32,material);

// PAREDES
box(0,8,-16,40,16,.5,wallMaterial);
box(0,8,16,40,16,.5,wallMaterial);
box(-20,8,0,.5,16,32,wallMaterial);
box(20,8,0,.5,16,32,wallMaterial);

// TETO
box(0,16,0,40,.5,32,wallMaterial);

// LUZ BÁSICA E LEVE
scene.add(new THREE.HemisphereLight(0xb5c4d5,0x303039,.85));

const ceilingLight=new THREE.PointLight(0xb5c9df,75,48);
ceilingLight.position.set(0,13,0);
scene.add(ceilingLight);

const sideLight=new THREE.PointLight(0x65778d,25,35);
sideLight.position.set(-12,8,-5);
scene.add(sideLight);

// JOGADOR
const player=new THREE.Vector3(0,0,10);
let yaw=0,pitch=0;
const keys={};
let started=false;

function start(){
 started=true;
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";
 camera.position.set(player.x,1.7,player.z);
}
document.getElementById("play").addEventListener("click",start);

// TECLADO
const keyMap={
 KeyW:"w",ArrowUp:"w",
 KeyS:"s",ArrowDown:"s",
 KeyA:"a",ArrowLeft:"a",
 KeyD:"d",ArrowRight:"d"
};

addEventListener("keydown",e=>{
 if(keyMap[e.code]){
  keys[keyMap[e.code]]=true;
  e.preventDefault();
 }
});
addEventListener("keyup",e=>{
 if(keyMap[e.code])keys[keyMap[e.code]]=false;
});

// BOTÕES DO CELULAR
const padMap={up:"w",down:"s",left:"a",right:"d"};

document.querySelectorAll(".pad button").forEach(button=>{
 const key=padMap[button.id];
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  button.addEventListener(event,()=>keys[key]=false);
 });
});

// OLHAR NO CELULAR
const look=document.getElementById("look");
let lastTouch=null;

look.addEventListener("pointerdown",e=>{
 lastTouch={x:e.clientX,y:e.clientY};
 look.setPointerCapture(e.pointerId);
});

look.addEventListener("pointermove",e=>{
 if(!lastTouch)return;
 const dx=e.clientX-lastTouch.x;
 const dy=e.clientY-lastTouch.y;
 yaw-=dx*.006;
 pitch-=dy*.004;
 pitch=Math.max(-1.2,Math.min(1.2,pitch));
 lastTouch={x:e.clientX,y:e.clientY};
});

look.addEventListener("pointerup",()=>lastTouch=null);
look.addEventListener("pointercancel",()=>lastTouch=null);

// MOUSE NO PC
renderer.domElement.addEventListener("click",()=>{
 if(started && innerWidth>700){
  renderer.domElement.requestPointerLock?.();
 }
});

document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
 }
});

// MOVIMENTO
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(started){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();

  if(keys.w)move.add(forward);
  if(keys.s)move.sub(forward);
  if(keys.d)move.add(right);
  if(keys.a)move.sub(right);

  if(move.lengthSq()>0){
   move.normalize().multiplyScalar(5*dt);
   player.add(move);
  }

  // LIMITES DA SALA
  player.x=THREE.MathUtils.clamp(player.x,-18.5,18.5);
  player.z=THREE.MathUtils.clamp(player.z,-14.5,14.5);

  camera.position.set(player.x,1.7,player.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
 }

 renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
})();
</script>
</body>
</html>
